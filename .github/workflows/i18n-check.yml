name: i18n Localization Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-localization:
    name: Audit & Verify i18n Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo Packages
        run: npm run build

      - name: Run Test Suite (35 tests)
        run: npm test

      - name: Verify TypeScript Type Safety
        run: npm run typecheck

      - name: Run i18n Localization Check on Examples
        run: node ./packages/cli/dist/index.js check --cwd ./examples --format markdown --output ./i18n-report.md
